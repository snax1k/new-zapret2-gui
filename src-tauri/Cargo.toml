[package]
name = "zapret2-gui"
version = "2.0.0"
description = "Zapret2 Control Center GUI for Windows, Linux, and macOS"
authors = ["bol-van", "Zapret2 Community"]
edition = "2021"

[lib]
name = "zapret2_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
